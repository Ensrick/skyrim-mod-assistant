; Ensrick Skyrim modlist configuration for Modern Lighting Overhaul 2.
; The vendor archive and its selected FOMOD output remain byte-identical in a
; separate MO2 mod. This owned overlay is the only file that changes policy.

; Preserve MLO2 5.4.1's actual source default: its particle-light templates
; are enabled, but existing placed lights are not removed. The shipped FOMOD
; omits this newer master switch, so spelling it out prevents a future default
; change from silently deleting Lux or city/interior light references.
disableLights=false
disableShadowCasters=true
disableTorchLights=true
removeFakeGlowOrbs=true
enableColorConsistency=true
loggingLevel=1

; These entries are currently defensive because disableLights=false. If the
; light-removal feature is ever deliberately enabled, MLO2 performs
; case-insensitive substring matching against the plugin that owns a light
; reference, so Lux and the adopted city/interior families remain protected.
; Add each future family's stable name fragment here before enabling it; never
; edit the vendor mod in place.
whitelist=Lux
whitelist=ENB Light.esp
whitelist=Grand Solitude
whitelist=Solitude Docks
whitelist=Snazzy

RGB Values= Red:255, Green:161, Blue:60
