; ============================================================================
;  Ensrick - Cloak Distribution Balance
;  SkyPatcher leveled-list rules. Issue #200.
;
;  The September 3 runtime log observed this file after every RMB leveled-list
;  config. SkyPatcher uses directory enumeration rather than a lexical sort,
;  however, so "zz" is not an ordering guarantee. The separate exact-path
;  Headgear shadow in this overlay is deterministic; these tuning directives
;  still require runtime-log order verification. Nothing edits an RMB file.
;
;  WHY. Cloaks of Skyrim and Pelts o Plenty both inject into the SAME shared
;  sublists in RMB SPID - Core Definitions.esp, and nothing arbitrates between
;  them. Two effects stack:
;    1. entry count - Pelts adds 3-14 entries per bucket, Cloaks of Skyrim 1-2;
;    2. chanceNone  - every Pelts list rolls chanceNone 0, while the Cloaks of
;       Skyrim lists carry 25-90 (LitemCloaksCommon 70, LitemCloaksThalmor 90).
;       Those numbers date from when Cloaks of Skyrim injected straight into
;       vanilla lists and had to gate its own rarity. Inside RMB the outer
;       lists already gate rarity, so the inner roll double-dips.
;  Measured before this file: Cloaks of Skyrim was 1.0% of the cloaks a
;  generic NPC can roll, and 8-25% of a guard's or faction NPC's.
;
;  FOUR DIALS, each one number, each in its own block below:
;     [1] GUARDS      - 100 = guards wear only Sons of Skyrim's own cloak
;     [2] RATIO       - chanceNone on the Cloaks of Skyrim lists; 0 = most
;     [3] FREQUENCY   - chanceNone on the outer lists; higher = fewer cloaks
;     [5] WARM PARITY - comment the block out to leave warm cloaks all-fur
; ============================================================================


; ============================================================================
; [1] GUARDS - the doubles.  DIAL: 100 (all nine lines, same number)
; ============================================================================
;  Thirteen hold-guard outfits receiving B6C..B74 are Sons of Skyrim overrides
;  that ALREADY contain a Sons of Skyrim hold cloak
;  (0_Windhelm_Cloak, 0_Whiterun_Cloak, 0_Fur_Collar_Brown, ...) on biped slot
;  46. RMB adds a second cloak list on top, and Pelts o Plenty sits on biped
;  slot 57, so the guard ends up wearing or carrying two cloaks. Merging the
;  two properly is what RMB SPIDified - Sons of Skyrim 83340 is for; it is not
;  installed here (issue #195) because it REPLACES the Sons of Skyrim plugin.
;
;  100 = the RMB guard roll always returns nothing, so a guard wears exactly
;  one cloak: the Sons of Skyrim one. Set these to 0 to restore RMB's second
;  cloak. If 83340 is ever adopted, delete this block - it would cancel the
;  merge that package performs.
;
;  B6C..B74 are injected into those thirteen hold-guard outfits. A separate
;  overlapping target, MQ304StormcloakOutfit, receives faction list B69 and is
;  deliberately not claimed as covered by this nine-list guard block.

filterByLLs=RMB SPID - Core Definitions.esp|B6C:chanceNone=100
filterByLLs=RMB SPID - Core Definitions.esp|B6D:chanceNone=100
filterByLLs=RMB SPID - Core Definitions.esp|B6E:chanceNone=100
filterByLLs=RMB SPID - Core Definitions.esp|B6F:chanceNone=100
filterByLLs=RMB SPID - Core Definitions.esp|B70:chanceNone=100
filterByLLs=RMB SPID - Core Definitions.esp|B71:chanceNone=100
filterByLLs=RMB SPID - Core Definitions.esp|B72:chanceNone=100
filterByLLs=RMB SPID - Core Definitions.esp|B73:chanceNone=100
filterByLLs=RMB SPID - Core Definitions.esp|B74:chanceNone=100


; ============================================================================
; [2] RATIO - Cloaks of Skyrim vs fur.  DIAL: 0 (all twenty lines, same number)
; ============================================================================
;  Every Pelts o Plenty list rolls chanceNone 0. These twenty rolled 25-90,
;  which is the single biggest reason Cloaks of Skyrim never showed up. 0 puts
;  the two mods on the same footing, so the odds are decided by entry count
;  alone. Raise this number to make cloth cloaks rarer again - 50 roughly
;  halves them, 70 restores the vendor default for the common lists. It leaks
;  a little into frequency: a Cloaks of Skyrim roll that returns nothing
;  leaves that NPC with no cloak at all.

filterByLLs=Cloaks - RMB SPCH.esp|804:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|805:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|806:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|809:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|80A:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|813:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|814:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|819:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|83B:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|83F:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|844:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|84B:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|84C:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|880:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|896:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|897:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|89E:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|8C8:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|984:chanceNone=0
filterByLLs=Cloaks - RMB SPCH.esp|D6C:chanceNone=0


; ============================================================================
; [3] FREQUENCY - how many NPCs wear a cloak at all.  DIAL: 55
; ============================================================================
;  RMB ships 35 on these, in its own Chances\CloakChances.ini. 35 puts a cloak
;  on roughly 3 in 5 of every NPC the framework touches, which is what "cloaks
;  may be distributed to more NPCs than intended" describes. 55 lands nearer
;  2 in 5. One number, every line the same: 0 = everyone, 100 = nobody.
;
;  ONLY the lists an outfit actually receives are gated here. RMB puts 35 on
;  both B5F and its children B96/B9B, which compounds - a generic NPC rolls
;  the gate twice and ends up 58% cloakless, not 35%. The second block below
;  opens the inner gates so this dial means what it says.

filterByLLs=RMB SPID - Core Definitions.esp|B5F:chanceNone=55
filterByLLs=RMB SPID - Core Definitions.esp|B60:chanceNone=55
filterByLLs=RMB SPID - Core Definitions.esp|B7E:chanceNone=55
filterByLLs=RMB SPID - Core Definitions.esp|B82:chanceNone=55
filterByLLs=RMB SPID - Core Definitions.esp|B61:chanceNone=55
filterByLLs=RMB SPID - Core Definitions.esp|B62:chanceNone=55
filterByLLs=RMB SPID - Core Definitions.esp|B63:chanceNone=55
filterByLLs=RMB SPID - Core Definitions.esp|B64:chanceNone=55
filterByLLs=RMB SPID - Core Definitions.esp|B65:chanceNone=55
filterByLLs=RMB SPID - Core Definitions.esp|B66:chanceNone=55
filterByLLs=RMB SPID - Core Definitions.esp|B67:chanceNone=55
filterByLLs=RMB SPID - Core Definitions.esp|B68:chanceNone=55
filterByLLs=RMB SPID - Core Definitions.esp|B69:chanceNone=55
filterByLLs=RMB SPID - Core Definitions.esp|B6A:chanceNone=55
filterByLLs=RMB SPID - Core Definitions.esp|B6B:chanceNone=55
; INNER lists - always 0, whatever the dial above is set to. B96 and B9B are
; RMB's own 35 (a second gate behind B5F); B97 and B99 are 33 baked into the
; plugin, which is why thin-common and warm-common cloaks were rarer than the
; other six buckets for no stated reason.
filterByLLs=RMB SPID - Core Definitions.esp|B96:chanceNone=0
filterByLLs=RMB SPID - Core Definitions.esp|B9B:chanceNone=0
filterByLLs=RMB SPID - Core Definitions.esp|B97:chanceNone=0
filterByLLs=RMB SPID - Core Definitions.esp|B99:chanceNone=0


; ============================================================================
; [4] STRUCTURAL - defects in the vendor configs. Not a dial.
; ============================================================================
;  (a) Dawnguard. RMB's Cloaks of Skyrim config points the Dawnguard bucket at
;      "Cloaks - Dawnguard.esp|800", a plugin this build does not install. The
;      SkyPatcher log says so on every launch:
;        [C] leveled Lists FE04EB62 Form not found: Cloaks - Dawnguard.esp|800
;      The list survived the RMB merge as Cloaks - RMB SPCH.esp|984
;      (DLC1LItemCloaksDawnguard). Point at the one that exists.
filterByLLs=RMB SPID - Core Definitions.esp|B62:addToLLs=Cloaks - RMB SPCH.esp|984~1~1

;  (b) The dark buckets. RMB puts LitemCloaksDarkCommon and LitemCloaksDarkEnch
;      in the *light* buckets and leaves the two dark ones entirely to fur.
;      Put them where their names say they belong, as well.
filterByLLs=RMB SPID - Core Definitions.esp|B98:addToLLs=Cloaks - RMB SPCH.esp|805~1~1
filterByLLs=RMB SPID - Core Definitions.esp|B9D:addToLLs=Cloaks - RMB SPCH.esp|806~1~1

;  (c) Three Pelts entries are duplicates. RMB_PoP_ListCloaks*Trimmed_UNUSED
;      802, 806 and 807 hold entry lists identical to 803, 801 and 800 -
;      verified entry by entry - so wherever both are injected, the duplicate
;      only doubles that branch's weight. Removing it costs no fur variety.
;      Removed ONLY from buckets that also carry the original.
filterByLLs=RMB SPID - Core Definitions.esp|B69:removeFromLLs=RMB SPCH - Pelt Cloaks.esp|807
filterByLLs=RMB SPID - Core Definitions.esp|B69:removeFromLLs=RMB SPCH - Pelt Cloaks.esp|806
filterByLLs=RMB SPID - Core Definitions.esp|B65:removeFromLLs=RMB SPCH - Pelt Cloaks.esp|807
filterByLLs=RMB SPID - Core Definitions.esp|B65:removeFromLLs=RMB SPCH - Pelt Cloaks.esp|806
filterByLLs=RMB SPID - Core Definitions.esp|B6A:removeFromLLs=RMB SPCH - Pelt Cloaks.esp|807
filterByLLs=RMB SPID - Core Definitions.esp|B97:removeFromLLs=RMB SPCH - Pelt Cloaks.esp|807
filterByLLs=RMB SPID - Core Definitions.esp|B9C:removeFromLLs=RMB SPCH - Pelt Cloaks.esp|807
filterByLLs=RMB SPID - Core Definitions.esp|B64:removeFromLLs=RMB SPCH - Pelt Cloaks.esp|802
filterByLLs=RMB SPID - Core Definitions.esp|B62:removeFromLLs=RMB SPCH - Pelt Cloaks.esp|802


; ============================================================================
; [5] WARM PARITY - comment this block out to leave warm cloaks all-fur
; ============================================================================
;  RMB splits the generic pool eight ways: thin/warm x common/rare x plain/dark.
;  Pelts reaches all eight. Cloaks of Skyrim reaches two, because RMB's
;  "01 Tweaks - Generic" gives every Cloaks of Skyrim item Survival_ArmorCold,
;  i.e. the thin tier. That is why a generic NPC almost never rolls one: six of
;  the eight buckets hold no cloth cloak at all.
;
;  Kept ON by default: the report is that a Cloaks of Skyrim cloak has never
;  been seen, and leaving six of eight buckets fur-only keeps it that way. The
;  cost is that a wool cloak can turn up where the framework expected a warm
;  one. Issue #189 is where that gets settled properly, by raising the Cloaks
;  of Skyrim warmth keyword instead of routing around it.
;  Comment out these four lines to restore "fur owns warm".

filterByLLs=RMB SPID - Core Definitions.esp|B99:addToLLs=Cloaks - RMB SPCH.esp|804~1~1
filterByLLs=RMB SPID - Core Definitions.esp|B9A:addToLLs=Cloaks - RMB SPCH.esp|805~1~1
filterByLLs=RMB SPID - Core Definitions.esp|B9E:addToLLs=Cloaks - RMB SPCH.esp|D6C~1~1
filterByLLs=RMB SPID - Core Definitions.esp|B9F:addToLLs=Cloaks - RMB SPCH.esp|806~1~1
