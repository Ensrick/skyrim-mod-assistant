; ============================================================================
;  Ensrick - Death Hound Loot Fix
;  SkyPatcher leveled-list rule. Issue #199.
;
;  WHAT WAS FOUND. The drop is vanilla Dawnguard, not a mod:
;
;      00D6F7:Dawnguard.esm  DLC1DeathItemDeathHound   flags=UseAll
;          0F961F:Skyrim.esm    LootSmallTreasure10
;          0EDB2E:Skyrim.esm    FoodDogMeat        <-- removed below
;          00F709:Dawnguard.esm DLC1DeathHoundCollar
;
;  Nothing in the load order overrides it - Dawnguard.esm is still the winner
;  across all 327 plugins. Simple Hunting Overhaul 1.16 overrides 24 death-item
;  lists (bear, cow, deer, elk, goat, horker, horse, mammoth, sabrecat,
;  skeever, troll, wolf, hare, fox, mudcrab, ...) and the death hound is not
;  among them; records/simple-hunting-overhaul-95943-2026-08-30.md recorded
;  that gap at adoption.
;
;  WHY REMOVE RATHER THAN ADD AN SHO HARVEST ENTRY. SHO's meat branch does not
;  gate anything. Its player alias adds `_MeatTracker` and returns; time and
;  hunting experience are charged only when a PELT reaches GlobalCheck(). So
;  adding the death hound to SHO's meat formlist would leave the meat exactly
;  as lootable as it is now, and would only be meaningful once the owned
;  harvest-time extension in #72 exists. A death hound is also an undead
;  vampire creature with no pelt: it has nothing to harvest, and edible meat on
;  it is the odd entry, not the missing one.
;
;  UseAll is set on this list, so every surviving entry is still granted: a
;  death hound keeps its collar and its small-treasure roll. LootSmallTreasure10
;  is deliberately left alone - SHO strips it from the animals it covers, but a
;  vampire's hound carrying a trinket is not what was reported and that call is
;  not ours to make silently.
;
;  Not touched: 1AF87E:Vigilant.esm zzzCHDeathItemHound, Vigilant's own hound,
;  which has the same shape (LootSmallTreasure10 + FoodDogMeat). Different
;  creature, different mod, and it was not what was observed.
; ============================================================================

filterByLLs=Dawnguard.esm|D6F7:removeFromLLs=Skyrim.esm|EDB2E
