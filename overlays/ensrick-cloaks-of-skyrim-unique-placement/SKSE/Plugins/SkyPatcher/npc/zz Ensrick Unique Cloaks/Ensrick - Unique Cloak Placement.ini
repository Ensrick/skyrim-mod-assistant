; ============================================================================
;  Ensrick - Cloaks of Skyrim Unique Placement
;  SkyPatcher npc rules. Issue #187.
;
;  RMB SPCH - Cloaks of Skyrim 1.5.3 ships ten unique-cloak directives in
;  SKSE\Plugins\SkyPatcher\npc\Cloaks - CoS\Cloaks - RMB SPCH.esp.ini, and all
;  ten name the wrong plugin:
;
;      filterByNpcs=Skyrim.esm|23A93:objectsToAdd=Skyrim.esm|8EF
;                                                 ^^^^^^^^^^
;  0008EF and its nine siblings are FormIDs in Cloaks - RMB SPCH.esp, not in
;  the master. Verified: skyrim-record-cli finds no record at 0008EF, 000D6B or
;  any of the others in Skyrim.esm, and finds all ten as ARMO in
;  Cloaks - RMB SPCH.esp. SkyPatcher does not log a miss on an npc objectsToAdd,
;  so the failure is silent: Idolaf Battle-Born and all nine dragon priests get
;  nothing. The leveled-list config in the same package gets the plugin right
;  (addToLLs=Cloaks - RMB SPCH.esp|809), which is what makes this a typo rather
;  than a design.
;
;  Second defect, last line of his file: filterByNpcs=Skyrim.esm|767 for Krosis.
;  Krosis is 00100767 (dunShearpointKrosisDragonPriest); 00000767 does not
;  exist. Fixed below.
;
;  This is a new file, never an edit of his: 116030's terms forbid editing his
;  files, and 6369 grants open permission for compatibility patches. His ten
;  directives stay on disk and stay inert; these ten do the work.
;
;  All ten target items are biped slot 46 and the NPCs' cloak slot is free, so
;  each is equipped rather than carried.
; ============================================================================

; 13BB2 >> IdolafBattleBorn "Idolaf Battle-Born"
; ITEM: D6B >> CloakCrimson "Cloak - Crimson Hide"
filterByNpcs=Skyrim.esm|13BB2:objectsToAdd=Cloaks - RMB SPCH.esp|D6B

; 23A93 >> EncDragonPriest "Dragon Priest"
; ITEM: 8EF >> CloakDragonPriest "Cloak - Dragon Priest"
filterByNpcs=Skyrim.esm|23A93:objectsToAdd=Cloaks - RMB SPCH.esp|8EF

; 327C2 >> Ianusu "Vokun"
