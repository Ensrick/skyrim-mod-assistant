; Ensrick Skyrim modlist overrides for official SSE Display Tweaks.
; Vendor DLL and default INI remain byte-identical in their own MO2 mod.

[Render]
Fullscreen=false
Borderless=true
; 120 Hz panel (#150, staged 2026-09-01, needs in-game test). STEP SkyrimSE:SSE Display Tweaks:
; limit 1 fps below the refresh rate (3 below for G-Sync/FreeSync: use 117 if the LG runs VRR).
; DT default was 240; VSync alone capped at 120, the limiter makes the cap driver-independent.
FramerateLimit=119

[HAVOK]
; 0 = let DT derive the Havok ceiling from FramerateLimit (in borderless DT ignores the VSync
; refresh: render.cpp GetMaxFramerate). Expected log line:
;   [HAVOK] (DYNAMIC) fMaxTime=0.00840336-0.0166667 fMaxTimeComplexOffset=30 (Max FPS = 119)
; DynamicMaxTimeScaling stays at the vendor default true; Skyrim.ini fMaxTime is fallback only.
MaximumFramerate=0

[Window]
; #149, user 2026-09-05: DT's unconditional resize/position capture can reclip
; without a foreground ownership check. One cursor owner only: the separately
; installed WindowFocusGuard confines ONLY the foreground game, releasing for
; Windows/Alt-Tab and focus loss. Rendering and Havok remain official DT.
LockCursor=false
