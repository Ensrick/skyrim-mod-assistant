name: Bounded Encounters

on:
  push:
    branches: [main]
    tags: ["bounded-encounters/v*"]
    paths:
      - "mods/bounded-encounters/**"
      - ".gitmodules"
      - ".github/workflows/bounded-encounters.yml"
  pull_request:
    paths:
      - "mods/bounded-encounters/**"
      - ".gitmodules"
      - ".github/workflows/bounded-encounters.yml"

permissions:
  contents: read

jobs:
  windows-release:
    name: windows-release-${{ matrix.replica }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    env:
      VCPKG_BINARY_SOURCES: clear
      BE_REPLICA: ${{ matrix.replica }}

    defaults:
      run:
        working-directory: mods/bounded-encounters

    steps:
      - name: Materialize tracked symlinks as archival placeholders
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          # GitHub's Windows image can create tracked links as reparse points.
          # Configure Git before checkout so every link is instead the regular
          # placeholder file used by the reviewed source archive. The packager
          # continues to reject every reparse point rather than dereferencing it.
          git config --global core.symlinks false
          if ((git config --global --get core.symlinks).Trim() -cne "false") {
            throw "Could not enforce safe Windows symlink materialization."
          }

      - name: Check out source and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Fix the source epoch before any build input is generated
        shell: pwsh
        run: |
          $epoch = (git show -s --format=%ct HEAD).Trim()
          if ($epoch -cnotmatch '^[0-9]+$') {
            throw "Unable to derive SOURCE_DATE_EPOCH from the checked-out commit."
          }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "SOURCE_DATE_EPOCH=$epoch`n",
            [System.Text.UTF8Encoding]::new($false))

      - name: Test deterministic package primitives
        shell: pwsh
        run: |
          .\tools\test-file-ordering.ps1
          .\tools\test-package-comparison.ps1
          .\tools\test-package-normalization.ps1

      - name: Initialize isolated vcpkg downloads
        shell: pwsh
        run: |
          $downloads = Join-Path $env:RUNNER_TEMP "bounded-encounters-vcpkg-downloads"
          New-Item -ItemType Directory -Path $downloads -Force | Out-Null
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "VCPKG_DOWNLOADS=$downloads`n",
            [System.Text.UTF8Encoding]::new($false))

      - name: Verify signed annotated release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $versionHeader = Get-Content .\src\Version.h -Raw
          if ($versionHeader -notmatch 'Semantic\s*=\s*"([^"]+)"') {
            throw "Unable to read the project semantic version."
          }
          $expectedTag = "bounded-encounters/v$($Matches[1])"
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' does not match '$expectedTag'."
          }

          git fetch --force --no-tags origin "refs/tags/$env:RELEASE_TAG`:refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git cat-file -t "refs/tags/$env:RELEASE_TAG").Trim() -cne "tag") {
            throw "Release ref is not an annotated tag object."
          }
          $head = (git rev-parse HEAD).Trim()
          if ((git rev-parse "refs/tags/$env:RELEASE_TAG^{}").Trim() -ne $head) {
            throw "Release tag does not peel to the checked-out commit."
          }
          $tagObject = git cat-file -p "refs/tags/$env:RELEASE_TAG" | Out-String
          $normalizedTagObject = $tagObject.Replace("`r`n", "`n").Replace("`r", "`n")
          $headerEnd = $normalizedTagObject.IndexOf("`n`n", [System.StringComparison]::Ordinal)
          if ($headerEnd -lt 0) {
            throw "Release tag object has no header/message boundary."
          }
          $tagHeaders = @($normalizedTagObject.Substring(0, $headerEnd).Split("`n"))
          if (@($tagHeaders | Where-Object { $_ -ceq "object $head" }).Count -ne 1 -or
              @($tagHeaders | Where-Object { $_ -ceq "type commit" }).Count -ne 1 -or
              @($tagHeaders | Where-Object { $_ -ceq "tag $env:RELEASE_TAG" }).Count -ne 1) {
            throw "Signed tag headers do not bind the exact release name directly to HEAD."
          }
          if ($tagObject -notmatch '-----BEGIN (?:SSH|PGP) SIGNATURE-----') {
            throw "Release tag is not cryptographically signed."
          }
          # Reviewed SSH release key fingerprint:
          # SHA256:wLKFaPWNivQgFTCbhQJSpNroFoekSoQHgtjHhzsM4ms
          $allowedSigners = Join-Path $env:RUNNER_TEMP "bounded-encounters-allowed-signers"
          [System.IO.File]::WriteAllText(
            $allowedSigners,
            "truthisfact@gmail.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFKFQFT3Ulgkds/m/9xgswbuhq4SxwKtVs7m6kdNLe3s`n",
            [System.Text.UTF8Encoding]::new($false))
          git -c gpg.format=ssh -c "gpg.ssh.allowedSignersFile=$allowedSigners" verify-tag "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag signature is not valid for the reviewed release signer."
          }

          $isShallow = (git rev-parse --is-shallow-repository).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($isShallow -eq "true") {
            git fetch --unshallow --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          } else {
            git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit is not reachable from the protected main branch."
          }

      - name: Hydrate and verify reviewed CommonLib provenance
        shell: pwsh
        run: |
          $commonLib = ".\extern\CommonLibSSE-NG"
          $forkCommit = "a9d7d4523d5e1abc8b296bd99683b7df11df652f"
          $upstreamCommit = "8b032fa992750d654d6d38a33731714d8b86be1f"

          # actions/checkout intentionally gives submodules a depth-one clone.
          # Fetch only the reviewed parent and tag needed by package.ps1's
          # provenance gate; keep HEAD fixed at the monorepo's pinned gitlink.
          $isShallow = (git -C $commonLib rev-parse --is-shallow-repository).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($isShallow -eq "true") {
            git -C $commonLib fetch --deepen=1 --no-tags origin $forkCommit
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git -C $commonLib fetch --force --no-tags origin "refs/tags/v7.0.0:refs/tags/v7.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ((git -C $commonLib rev-parse HEAD).Trim() -ne $forkCommit) {
            throw "CommonLib HEAD moved away from the pinned fork commit."
          }
          if ((git -C $commonLib rev-parse HEAD^).Trim() -ne $upstreamCommit) {
            throw "CommonLib fork parent does not match reviewed upstream v7.0.0."
          }
          if ((git -C $commonLib rev-list -n 1 v7.0.0).Trim() -ne $upstreamCommit) {
            throw "CommonLib v7.0.0 tag does not resolve to the reviewed upstream commit."
          }

      - name: Check out pinned vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: microsoft/vcpkg
          ref: fab1c6dc7a944372a90a1e19ab5e8e32cd658fc2
          path: mods/bounded-encounters/.vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Build, test, simulate, and audit the DLL
        shell: pwsh
        env:
          BE_VCPKG_ROOT: ${{ github.workspace }}\mods\bounded-encounters\.vcpkg
          CMAKE_BUILD_PARALLEL_LEVEL: "3"
          VCPKG_MAX_CONCURRENCY: "3"
        run: |
          .\tools\build.bat
          if ($LASTEXITCODE -ne 0) {
            Get-Content .\tools\build.log
            exit $LASTEXITCODE
          }
          if ($env:VCPKG_BINARY_SOURCES -cne "clear") {
            throw "Release CI must disable vcpkg binary caches."
          }
          if (Select-String -Path .\tools\build.log -Pattern 'Restored [1-9][0-9]* package') {
            throw "Release CI restored dependencies from a vcpkg binary cache instead of building them from source."
          }
          Get-Content .\tools\build.log -Tail 120

      - name: Package the isolated clean build
        shell: pwsh
        run: |
          $packageDirectory = ".\build\release\packages-$env:BE_REPLICA"
          $package = .\tools\package.ps1 -OutputDirectory $packageDirectory | ConvertFrom-Json
          $head = (git rev-parse HEAD).Trim()
          if ($package.releaseEligible -ne $true) {
            throw "CI produced a package that is not release eligible."
          }
          if ($package.sourceCommit -ne $head) {
            throw "Package provenance does not identify the checked-out commit."
          }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $head -ne $env:GITHUB_SHA) {
            throw "Tagged checkout HEAD does not match GITHUB_SHA."
          }

          $versionHeader = Get-Content .\src\Version.h -Raw
          if ($versionHeader -notmatch 'Semantic\s*=\s*"([^"]+)"') {
            throw "Unable to read the project semantic version."
          }
          $version = $Matches[1]
          if ($versionHeader -notmatch 'SupportedRuntime\s*\{\s*([0-9]+)\s*,\s*([0-9]+)\s*,\s*([0-9]+)\s*,\s*([0-9]+)\s*\}') {
            throw "Unable to read the supported Skyrim runtime."
          }
          $runtime = "$($Matches[1]).$($Matches[2]).$($Matches[3]).$($Matches[4])"
          $expectedNames = @(
            "BoundedEncounters-$version-Skyrim-$runtime-win64.zip",
            "BoundedEncounters-$version-Skyrim-$runtime-win64.zip.sha256",
            "BoundedEncounters-$version-corresponding-source.zip",
            "BoundedEncounters-$version-corresponding-source.zip.sha256")
          [string[]]$actualNames = @(Get-ChildItem -LiteralPath $packageDirectory -File | ForEach-Object Name)
          [string[]]$sortedExpected = @($expectedNames)
          [System.Array]::Sort[string]($actualNames, [System.StringComparer]::Ordinal)
          [System.Array]::Sort[string]($sortedExpected, [System.StringComparer]::Ordinal)
          if ($actualNames.Count -ne $sortedExpected.Count) {
            throw "Package directory has missing or unexpected files: $packageDirectory"
          }
          for ($index = 0; $index -lt $actualNames.Count; ++$index) {
            if ($actualNames[$index] -cne $sortedExpected[$index]) {
              throw "Package directory has missing, renamed, or unexpected files: $packageDirectory"
            }
          }

      - name: Upload staged mod, simulator, and raw build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-encounters-${{ github.sha }}-${{ matrix.replica }}
          if-no-files-found: warn
          overwrite: true
          path: |
            mods/bounded-encounters/build/release/stage/**
            mods/bounded-encounters/build/release/simulation-smoke.json
            mods/bounded-encounters/build/release/binary-audit.json
            mods/bounded-encounters/tools/build.log
            mods/bounded-encounters/build/release/vcpkg_installed/**/vcpkg.spdx.json

      - name: Upload isolated test-candidate packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-encounters-package-${{ github.sha }}-${{ matrix.replica }}
          if-no-files-found: error
          overwrite: true
          path: |
            mods/bounded-encounters/build/release/packages-${{ matrix.replica }}/*.zip
            mods/bounded-encounters/build/release/packages-${{ matrix.replica }}/*.zip.sha256

  release-candidate-reproducibility:
    name: bounded-encounters-release-candidate
    needs: windows-release
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read

    defaults:
      run:
        working-directory: mods/bounded-encounters

    steps:
      - name: Materialize tracked symlinks as archival placeholders
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.symlinks false
          if ((git config --global --get core.symlinks).Trim() -cne "false") {
            throw "Could not enforce safe Windows symlink materialization."
          }

      - name: Check out comparison scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Download isolated candidate A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bounded-encounters-package-${{ github.sha }}-a
          path: ${{ runner.temp }}/bounded-encounters-package-a

      - name: Download isolated candidate B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bounded-encounters-package-${{ github.sha }}-b
          path: ${{ runner.temp }}/bounded-encounters-package-b

      - name: Require byte-identical independent clean builds
        shell: pwsh
        run: |
          $report = .\tools\compare-package-directories.ps1 `
            -ReferenceDirectory "$env:RUNNER_TEMP\bounded-encounters-package-a" `
            -CandidateDirectory "$env:RUNNER_TEMP\bounded-encounters-package-b"
          $reportPath = ".\build\release\independent-build-reproducibility.json"
          New-Item -ItemType Directory -Path (Split-Path -Parent $reportPath) -Force | Out-Null
          [System.IO.File]::WriteAllText(
            $reportPath,
            ($report | Out-String).Replace("`r`n", "`n").Replace("`r", "`n").TrimEnd() + "`n",
            [System.Text.UTF8Encoding]::new($false))
          Get-Content -LiteralPath $reportPath

      - name: Require the signed tag to reproduce protected-main artifacts
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runsResponse = gh api `
            "repos/$env:GITHUB_REPOSITORY/actions/workflows/bounded-encounters.yml/runs?branch=main&event=push&status=success&head_sha=$env:GITHUB_SHA&per_page=20" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $matchingRuns = @($runsResponse.workflow_runs | Where-Object {
              [string]$_.head_sha -ceq $env:GITHUB_SHA -and
              [string]$_.head_branch -ceq "main" -and
              [string]$_.conclusion -ceq "success"
            } | Sort-Object run_number -Descending)
          if ($matchingRuns.Count -eq 0) {
            throw "No successful protected-main Bounded Encounters run exists for $env:GITHUB_SHA."
          }
          $mainRunId = [long]$matchingRuns[0].id
          $artifactName = "bounded-encounters-package-$env:GITHUB_SHA"
          $artifactResponse = gh api `
            "repos/$env:GITHUB_REPOSITORY/actions/runs/$mainRunId/artifacts?per_page=100" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $matchingArtifacts = @($artifactResponse.artifacts | Where-Object {
              [string]$_.name -ceq $artifactName -and $_.expired -eq $false
            })
          if ($matchingArtifacts.Count -ne 1) {
            throw "Protected-main run $mainRunId does not expose exactly one unexpired canonical package artifact."
          }
          $mainDirectory = Join-Path $env:RUNNER_TEMP "bounded-encounters-package-main"
          if (Test-Path -LiteralPath $mainDirectory) {
            throw "Protected-main comparison destination already exists: $mainDirectory"
          }
          New-Item -ItemType Directory -Path $mainDirectory | Out-Null
          gh run download $mainRunId `
            --repo $env:GITHUB_REPOSITORY `
            --name $artifactName `
            --dir $mainDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tools\compare-package-directories.ps1 `
            -ReferenceDirectory $mainDirectory `
            -CandidateDirectory "$env:RUNNER_TEMP\bounded-encounters-package-a"

      - name: Upload canonical reproducible test-candidate packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-encounters-package-${{ github.sha }}
          if-no-files-found: error
          overwrite: true
          path: |
            ${{ runner.temp }}/bounded-encounters-package-a/*.zip
            ${{ runner.temp }}/bounded-encounters-package-a/*.zip.sha256

      - name: Upload independent-build reproducibility report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-encounters-reproducibility-${{ github.sha }}
          if-no-files-found: error
          overwrite: true
          path: mods/bounded-encounters/build/release/independent-build-reproducibility.json
