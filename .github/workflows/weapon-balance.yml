name: Weapon balance

on:
  pull_request:
    paths:
      - ".github/workflows/weapon-balance.yml"
      - "mods/weapon-balance/**"
      - "records/source-builds/ensrick-weapon-speed-balance.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/weapon-balance.yml"
      - "mods/weapon-balance/**"
      - "records/source-builds/ensrick-weapon-speed-balance.json"

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: mods/weapon-balance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.102
          cache: true
          cache-dependency-path: mods/weapon-balance/**/packages.lock.json
      - name: Restore locked dependencies
        run: |
          dotnet restore src/WeaponBalancePatcher/WeaponBalancePatcher.csproj --locked-mode
          dotnet restore tests/WeaponBalancePatcher.Tests/WeaponBalancePatcher.Tests.csproj --locked-mode
      - name: Build patcher
        run: dotnet build src/WeaponBalancePatcher/WeaponBalancePatcher.csproj -c Release --no-restore
      - name: Run balance tests
        run: dotnet run --project tests/WeaponBalancePatcher.Tests/WeaponBalancePatcher.Tests.csproj -c Release --no-restore
      - name: Run built-in invariant test
        run: ./src/WeaponBalancePatcher/bin/Release/net9.0/WeaponBalancePatcher.exe self-test
