name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse PowerShell and JSON
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = [System.Collections.Generic.List[string]]::new()

          foreach ($path in @(git ls-files '*.ps1')) {
            $tokens = $null
            $errors = $null
            [void] [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref] $tokens,
              [ref] $errors
            )
            foreach ($error in @($errors)) {
              $failures.Add("${path}: $($error.Message)")
            }
          }

          foreach ($path in @(git ls-files '*.json')) {
            try {
              Get-Content -LiteralPath $path -Raw | ConvertFrom-Json | Out-Null
            } catch {
              $failures.Add("${path}: $($_.Exception.Message)")
            }
          }

          if ($failures.Count -gt 0) {
            $failures | Write-Error
            exit 1
          }

      - name: Install locked generator runtimes
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build and self-test compatibility generator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'mods/general-compatibility-patch/generator/GeneralCompatibilityPatcher.csproj'
          dotnet restore $project --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project $project -c Release --no-build -- --self-test `
            records/synthesis/compatibility-sweep-2026-08-29/decisions.json `
            mods/general-compatibility-patch/expected-values.json `
            mods/general-compatibility-patch/manifest.json `
            records/source-builds/ensrick-general-compatibility-patch.json `
            mods/general-compatibility-patch/spriggit
          exit $LASTEXITCODE
