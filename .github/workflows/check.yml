name: Check

on:
  push:
    branches: [main, 'ensrick/modpack-roadmap-*', 'ensrick/currency-complete-tiers']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse PowerShell and JSON
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = [System.Collections.Generic.List[string]]::new()

          foreach ($path in @(git ls-files '*.ps1')) {
            $tokens = $null
            $errors = $null
            [void] [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref] $tokens,
              [ref] $errors
            )
            foreach ($error in @($errors)) {
              $failures.Add("${path}: $($error.Message)")
            }
          }

          foreach ($path in @(git ls-files '*.json')) {
            try {
              Get-Content -LiteralPath $path -Raw | ConvertFrom-Json | Out-Null
            } catch {
              $failures.Add("${path}: $($_.Exception.Message)")
            }
          }

          if ($failures.Count -gt 0) {
            $failures | Write-Error
            exit 1
          }

      - name: Test post-load crash acceptance boundary
        shell: pwsh
        run: |
          python -m unittest discover -s audit -p test_launch_verify_settle.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python audit/launch_verify.py --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test read-only SKSE event inventory
        shell: pwsh
        run: |
          python -m unittest discover -s audit -p test_skse_mod_event_inventory.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test pinned Unbound jail-pool source transformation
        shell: pwsh
        run: |
          python -m unittest discover -s patches/unbound-jail-pool -p test_prepare.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test private-desktop worker containment
        shell: pwsh
        run: |
          pwsh -NoProfile -File audit/test_quiet_worker.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test published BTPS control-map repair
        shell: pwsh
        run: |
          pwsh -NoProfile -File audit/test_btps_controlmap_patch.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test weapon audit gates with synthetic fixtures
        shell: pwsh
        run: |
          python -m unittest discover -s audit -p test_weapon_balance_gate.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s audit -p test_weapon_timing.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ports/lost-longswords/test_curation_units.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test full-cloak reservation and strict plugin reader
        shell: pwsh
        run: |
          python -m unittest discover -s audit -p test_biped_slot_audit.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s audit -p test_cloak_exclusivity.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File audit/test_nif_slot_layer_config_admission.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test native currency save admission with synthetic co-saves
        shell: pwsh
        run: |
          python -m unittest discover -s audit -p test_currency_save_cli.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s audit -p test_currency_save_gate.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s audit -p test_currency_native_candidate.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s audit -p test_currency_tier_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s audit -p test_currency_bos_gate.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s audit -p test_currency_purse_gate.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s audit -p test_currency_winner_gate.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s audit -p test_currency_skypatcher_masks.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check actual complete currency policy and distribution payloads
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0,'mods/currency-integration'); import validate as v; p=v.load_json(v.ROOT/'policy.json'); c=v.load_json(v.RUNTIME_CONFIG); v.validate_policy(p); v.validate_runtime_config(c,p); v.validate_distribution_configs(c); v.validate_ui_and_runtime_overrides(c); print('Complete currency policy/runtime/BOS/KID/CDF/UI: PASS')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check out pinned currency header contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ensrick/CommonLibSSE-NG
          ref: 90a64a4d65ce659a139137c968f42151bb6ecec9
          path: .ci/currency-commonlib
          persist-credentials: false

      - name: Test native currency policy and initialization adapters
        shell: pwsh
        run: |
          cmake -S mods/currency-integration/native -B .ci/currency-tests -A x64 -DCOMMONLIBSSE_ROOT="${{ github.workspace }}/.ci/currency-commonlib" -DENSRICK_BUILD_PLUGIN=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build .ci/currency-tests --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir .ci/currency-tests -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
