groups:
  - name: 'Ensrick Compatibility Patches'
    after: [ 'Late Loaders' ]
  - name: 'Ensrick Generated Patches'
    after: [ 'Ensrick Compatibility Patches' ]

plugins:
  # AOS 4.1.3 ships this EBT Lite patch in its own archive. It must follow ISC
  # so its EBT decals survive, then the owned one-record repair restores ISC's
  # explicitly assigned impact sound on 0F0EB1.
  - name: 'AOS_EBT LITE Patch.esp'
    group: 'Ensrick Compatibility Patches'
    after:
      - 'dD - Enhanced Blood Main LITE.esp'
      - 'Audio Overhaul Skyrim.esp'
      - 'Immersive Sounds - Compendium.esp'
      - 'AOS_ISC_Integration.esp'

  - name: 'Ensrick AOS EBT ISC Patch.esp'
    group: 'Ensrick Generated Patches'
    after:
      - 'AOS_EBT LITE Patch.esp'
      - 'Immersive Sounds - Compendium.esp'
      - 'AOS_ISC_Integration.esp'

  # The official CRF locations patch is a required input, but it is not a safe
  # standalone winner over this profile's SLaWF/LFfGM layers. Install it only
  # in the same transaction as the generated landscape merge below.
  - name: 'Landscape Fixes For Grass mods - Cutting Room Floor Locations.esp'
    group: 'Ensrick Compatibility Patches'
    after:
      - 'Landscape Fixes For Grass Mods.esp'
      - 'Landscape and Water Fixes - Patch - LFfGM.esp'
      - 'Landscape and Water Fixes - Patch - LFfGM - GotT.esp'
      - 'cutting room floor.esp'

  # Generated from the current winners for all eleven parent CELL records and
  # the three shared Whiterun LAND records. 00A61C remains decision-gated.
  - name: 'Ensrick LFfGM CRF Landscape Patch.esp'
    group: 'Ensrick Generated Patches'
    after:
      - 'Landscape Fixes For Grass mods - Cutting Room Floor Locations.esp'
      - 'Landscape and Water Fixes - Patch - LFfGM - GotT.esp'
      - 'Lux Via - plugin.esp'
      - 'Lux Orbis - Cutting Room Floor patch.esp'
      - 'Lux Orbis - USSEP patch.esp'
      - 'Lux Orbis CS.esp'
      - 'Nature of the Wild Lands.esp'
      - 'Nature of the Wild Lands - CuttingRoomFloor.esp'
      - 'Ensrick Currency Integration Patch.esp'

  # Lux CS' own FOMOD says its Orbis plugin must load after Orbis and all
  # Orbis patches. The upstream masterlist does not currently enforce this.
  - name: 'Lux Orbis CS.esp'
    after:
      - 'Lux Orbis.esp'
      - 'Lux Orbis - Riften Sconce Patch.esp'
      - 'Lux Orbis - USSEP patch.esp'
      - 'Sons of Skyrim - Lux Orbis Patch.esp'

  # The upstream masterlist currently matches an older, shorter filename and
  # otherwise sorts this official patch after the generated conflict patch.
  - name: 'Lux - Water for ENB (Shades of skyrim) patch.esp'
    group: 'Ensrick Compatibility Patches'
    after:
      - 'WENB Shades USSEP.esp'

  # Generated from the complete active load order and therefore must remain
  # after every input winner, including the official compatibility patch.
  - name: 'Ensrick Lux Water CS Patch.esp'
    group: 'Ensrick Generated Patches'
    after:
      - 'Lux - Water for ENB (Shades of skyrim) patch.esp'
      - 'WENB Shades USSEP.esp'

  # Small owned semantic patches are generated from current-profile winners;
  # keep them behind late map, water, and profile-specific compatibility layers.
  - name: 'Ensrick General Compatibility Patch.esp'
    group: 'Ensrick Generated Patches'
    after:
      - 'Ensrick Lux Water CS Patch.esp'
      - 'Lux - Water for ENB (Shades of skyrim) patch.esp'
      - 'A Clear Map of Skyrim.esp'
      - 'ACMOS - Bruma.esp'

  - name: 'Ensrick CRF Semantic Patch.esp'
    group: 'Ensrick Generated Patches'
    after:
      - 'Ensrick General Compatibility Patch.esp'
      - 'Water for ENB (Shades of Skyrim).esp'
      - 'nwsFollowerFramework.esp'
      - 'Skyrim Unbound.esp'
      - 'Lux.esp'

  # Guard scaling (#51): overrides the two vanilla guard stats templates that
  # USSEP forwards and Dragonborn's Redoran guard template; must stay behind
  # every other Ensrick generated patch and anything else touching NPC_ records.
  - name: 'Ensrick Guard Scaling Patch.esp'
    group: 'Ensrick Generated Patches'
    after:
      - 'Ensrick CRF Semantic Patch.esp'
      - 'unofficial skyrim special edition patch.esp'
      - 'NW_Sons_of_Skyrim.esp'
      - 'NW_Sons_of_Skyrim - My fixes by Xtudo.esp'
      - 'cutting room floor.esp'

  # Wolf territorial behaviour (#42): overrides the AI aggro-radius bands on the
  # ambient wolf bases of Skyrim, Bruma, Beyond Reach and the Gray Cowl, and
  # de-inherits the Flaming Familiar. Must stay behind every other Ensrick
  # generated patch and anything else touching those NPC_ records.
  - name: 'Ensrick Wolf Territorial Patch.esp'
    group: 'Ensrick Generated Patches'
    after:
      - 'Ensrick Guard Scaling Patch.esp'
      - 'Ensrick CRF Semantic Patch.esp'
      - 'unofficial skyrim special edition patch.esp'
      - 'Unofficial Skyrim Modders Patch.esp'
      - 'BSHeartland.esm'
      - 'arnima.esm'
      - 'Gray Fox Cowl.esm'

  # Regional-currency integration (#207): this owned ESPFE forwards the active
  # ECE/COIN/MINT winners, disables exchange-to-ingot arbitrage, and replaces
  # vanilla purse lists. Keep it behind every record source it was built from.
  - name: 'Ensrick Currency Integration Patch.esp'
    group: 'Ensrick Generated Patches'
    after:
      - 'Ensrick Wolf Territorial Patch.esp'
      - 'exchangeCurrency_enhanced.esp'
      - 'exchangeCurrency_patch_COIN.esp'
      - 'C.O.I.N.esp'
      - 'M.I.N.T.esp'
